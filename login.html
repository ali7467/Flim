<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#08080d">

    <title>Giriş Yap - FilmKeyfi</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <a href="index.html" class="auth-logo">
        <span>FILM</span>KEYFİ
    </a>

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                🎬
            </div>

            <h1>Hoş Geldin</h1>

            <p class="auth-subtitle">
                FilmKeyfi hesabına giriş yap
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label for="loginEmail">
                        E-posta
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="ornek@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="loginPassword">
                        Şifre
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Şifrenizi girin"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            data-target="loginPassword"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <div class="auth-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>Beni hatırla</span>

                    </label>

                    <a href="#" id="forgotPassword">
                        Şifremi unuttum
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                    id="loginButton"
                >
                    Giriş Yap
                </button>

                <div
                    class="auth-message"
                    id="loginMessage"
                ></div>

            </form>


            <div class="auth-divider">
                <span>veya</span>
            </div>


            <div class="social-login">

                <button
                    type="button"
                    class="social-button"
                    id="googleLogin"
                >
                    <span>G</span>
                    Google ile devam et
                </button>

            </div>


            <p class="auth-bottom">

                Hesabın yok mu?

                <a href="register.html">
                    Ücretsiz üye ol
                </a>

            </p>

        </div>

    </main>


    <script src="js/auth.js"></script>

</body>
</html>
