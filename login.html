<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>Admin Girişi | FilmKeyfi</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #030303;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .admin-login {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 0, 60, .14),
                    transparent 42%
                ),
                #030303;
        }

        .login-card {
            width: 100%;
            max-width: 400px;

            padding: 32px 25px;

            background:
                linear-gradient(
                    145deg,
                    #141414,
                    #080808
                );

            border: 1px solid
                rgba(255, 0, 60, .35);

            border-radius: 16px;

            box-shadow:
                0 0 35px
                rgba(255, 0, 60, .15),
                0 25px 70px
                rgba(0, 0, 0, .8);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;

            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo h1 span {
            color: #ff003c;

            text-shadow:
                0 0 8px #ff003c,
                0 0 20px
                rgba(255, 0, 60, .5);
        }

        .logo p {
            margin-top: 8px;

            color: #777;

            font-size: 11px;

            letter-spacing: 3px;
        }

        .security-badge {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            margin-bottom: 25px;

            padding: 10px;

            color: #ff5575;

            background:
                rgba(255, 0, 60, .06);

            border: 1px solid
                rgba(255, 0, 60, .15);

            border-radius: 8px;

            font-size: 11px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #aaa;

            font-size: 12px;

            font-weight: bold;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #666;
        }

        .form-group input {
            width: 100%;
            height: 50px;

            padding:
                0 14px 0 42px;

            color: #fff;

            background: #060606;

            border: 1px solid
                rgba(255,255,255,.1);

            border-radius: 8px;

            outline: none;

            font-size: 14px;

            transition: .25s;
        }

        .form-group input:focus {
            border-color: #ff003c;

            box-shadow:
                0 0 15px
                rgba(255,0,60,.15);
        }

        .login-button {
            width: 100%;
            height: 50px;

            margin-top: 8px;

            border: 0;
            border-radius: 8px;

            background: #ff003c;

            color: #fff;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 18px
                rgba(255,0,60,.35);

            transition: .25s;
        }

        .login-button:hover {
            background: #ff174f;

            box-shadow:
                0 0 30px
                rgba(255,0,60,.65);
        }

        .login-button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #loginMessage {
            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 12px;
        }

        #loginMessage.error {
            display: block;

            color: #ff6b86;

            background:
                rgba(255,0,60,.08);

            border: 1px solid
                rgba(255,0,60,.2);
        }

        #loginMessage.success {
            display: block;

            color: #55df91;

            background:
                rgba(0,200,100,.07);

            border: 1px solid
                rgba(0,200,100,.2);
        }

        .back-home {
            display: block;

            margin-top: 22px;

            color: #666;

            text-align: center;

            text-decoration: none;

            font-size: 12px;
        }

        .back-home:hover {
            color: #ff003c;
        }

        .footer-note {
            margin-top: 25px;

            color: #444;

            text-align: center;

            font-size: 10px;
        }

    </style>

</head>


<body>


    <main class="admin-login">

        <section class="login-card">


            <div class="logo">

                <h1>
                    <span>FILM</span>KEYFİ
                </h1>

                <p>
                    ADMIN PANEL
                </p>

            </div>


            <div class="security-badge">

                🔐

                <span>
                    Güvenli yönetici girişi
                </span>

            </div>


            <form id="adminLoginForm">


                <!-- E-POSTA -->

                <div class="form-group">

                    <label for="email">
                        Admin E-posta
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input
                            type="email"
                            id="email"
                            value="alitor741001@gmail.com"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- ŞİFRE -->

                <div class="form-group">

                    <label for="password">
                        Şifre
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔑
                        </span>

                        <input
                            type="password"
                            id="password"
                            autocomplete="current-password"
                            placeholder="Şifrenizi girin"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Giriş Yap
                </button>


                <div
                    id="loginMessage"
                ></div>


            </form>


            <a
                href="index.html"
                class="back-home"
            >
                ← Ana sayfaya dön
            </a>


            <div class="footer-note">
                FilmKeyfi Yönetim Sistemi
            </div>


        </section>

    </main>


    <script>

        const form =
            document.getElementById(
                "adminLoginForm"
            );

        const message =
            document.getElementById(
                "loginMessage"
            );

        const button =
            document.getElementById(
                "loginButton"
            );


        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                message.className =
                    "error";

                message.textContent =
                    "Güvenli admin doğrulaması henüz backend'e bağlanmadı.";

            }
        );

   <script>

const form =
    document.getElementById("adminLoginForm");

const message =
    document.getElementById("loginMessage");

const button =
    document.getElementById("loginButton");


form.addEventListener("submit", function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if (email !== "alitor741001@gmail.com") {

        message.className = "error";

        message.textContent =
            "E-posta adresi hatalı.";

        return;
    }


    if (!password) {

        message.className = "error";

        message.textContent =
            "Lütfen şifrenizi girin.";

        return;
    }


    /*
       Gerçek şifre kontrolü Cloudflare Worker
       bağlandıktan sonra burada yapılacak.
    */

    button.disabled = true;

    button.textContent =
        "Kontrol ediliyor...";


    message.className = "success";

    message.textContent =
        "E-posta doğrulandı. Güvenli sunucu bağlantısı bekleniyor.";


    setTimeout(function() {

        button.disabled = false;

        button.textContent =
            "Giriş Yap";

    }, 1500);

});

</script>


</body>

</html>
