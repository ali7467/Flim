<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FilmKeyfi Admin Giriş</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle, rgba(255,0,60,.18), transparent 45%),
        #030303;

    display: flex;
    align-items: center;
    justify-content: center;
}

.login-box {
    width: 90%;
    max-width: 390px;
    padding: 30px 25px;
    background: #101010;
    border: 1px solid rgba(255,0,60,.4);
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(255,0,60,.2);
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo h1 {
    margin: 0;
    font-size: 32px;
}

.logo span {
    color: #ff003c;
    text-shadow: 0 0 15px #ff003c;
}

.logo p {
    color: #777;
    font-size: 11px;
    letter-spacing: 3px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #aaa;
    font-size: 12px;
}

input {
    width: 100%;
    height: 50px;
    margin-bottom: 18px;
    padding: 0 14px;
    background: #050505;
    color: white;
    border: 1px solid #333;
    border-radius: 8px;
    outline: none;
}

input:focus {
    border-color: #ff003c;
    box-shadow: 0 0 15px rgba(255,0,60,.25);
}

button {
    width: 100%;
    height: 50px;
    border: 0;
    border-radius: 8px;
    background: #ff003c;
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,0,60,.4);
}

#message {
    margin-top: 15px;
    text-align: center;
    font-size: 13px;
}

.back {
    display: block;
    margin-top: 20px;
    text-align: center;
    color: #777;
    text-decoration: none;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1><span>FILM</span>KEYFİ</h1>
        <p>ADMIN PANEL</p>
    </div>

    <form id="loginForm">

        <label>E-posta</label>

        <input
            type="email"
            id="email"
            value="alitor741001@gmail.com"
            required
        >

        <label>Şifre</label>

        <input
            type="password"
            id="password"
            placeholder="Şifrenizi girin"
            required
        >

        <button type="submit">
            GİRİŞ YAP
        </button>

        <div id="message"></div>

    </form>

    <a href="index.html" class="back">
        ← Ana Sayfaya Dön
    </a>

</div>

<script>

document
.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    if (
        email === "alitor741001@gmail.com" &&
        password === "Alt7474"
    ) {

        sessionStorage.setItem(
            "filmkeyfi_admin",
            "true"
        );

        message.style.color = "#55ff99";

        message.textContent =
            "Giriş başarılı!";

        setTimeout(function() {

            window.location.href =
                "admin.html";

        }, 500);

    } else {

        message.style.color = "#ff5575";

        message.textContent =
            "E-posta veya şifre hatalı.";

    }

});

</script>

</body>
</html>
