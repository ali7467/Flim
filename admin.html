<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>Admin Paneli - FilmKeyfi</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .admin-page {
            min-height: 100vh;
            padding: 35px 5% 110px;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255,0,60,.13),
                    transparent 35%
                ),
                #050505;
        }

        .admin-container {
            max-width: 900px;
            margin: auto;
        }

        .admin-header {
            margin-bottom: 30px;
        }

        .admin-header h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .admin-header h1 span {
            color: #ff003c;
            text-shadow:
                0 0 10px
                rgba(255,0,60,.7);
        }

        .admin-header p {
            color: #777;
            font-size: 14px;
        }

        .admin-panel {
            background:
                linear-gradient(
                    145deg,
                    #111113,
                    #090909
                );

            border: 1px solid
                rgba(255,0,60,.18);

            border-radius: 12px;

            padding: 25px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.5);
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {

            width: 100%;

            background: #080808;

            color: white;

            border:
                1px solid
                rgba(255,255,255,.1);

            border-radius: 7px;

            outline: none;

            padding: 13px;

            font-family: inherit;

            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {

            border-color: #ff003c;

            box-shadow:
                0 0 15px
                rgba(255,0,60,.12);
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-help {
            color: #555;
            font-size: 11px;
        }

        .admin-actions {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 25px;

            padding-top: 20px;

            border-top:
                1px solid
                rgba(255,255,255,.06);
        }

        .admin-button {

            min-height: 45px;

            padding: 0 20px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;

            font-size: 13px;
        }

        .cancel-button {

            background: #111;

            color: #aaa;

            border:
                1px solid
                rgba(255,255,255,.1);
        }

        .save-button {

            background: #ff003c;

            color: white;

            border:
                1px solid #ff003c;

            box-shadow:
                0 0 15px
                rgba(255,0,60,.3);
        }

        #adminMessage {

            margin-top: 15px;

            padding: 12px;

            border-radius: 7px;

            display: none;

            font-size: 13px;
        }

        #adminMessage.success {

            display: block;

            background:
                rgba(0,180,80,.08);

            border:
                1px solid
                rgba(0,180,80,.25);

            color: #52d98a;
        }

        #adminMessage.error {

            display: block;

            background:
                rgba(255,0,60,.08);

            border:
                1px solid
                rgba(255,0,60,.25);

            color: #ff5575;
        }

        @media (max-width: 650px) {

            .admin-page {
                padding:
                    25px 15px
                    100px;
            }

            .admin-header h1 {
                font-size: 29px;
            }

            .admin-panel {
                padding: 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .admin-actions {
                flex-direction: column-reverse;
            }

            .admin-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <a
        href="index.html"
        class="logo"
    >
        <span>FILM</span>KEYFİ
    </a>

    <div class="header-actions">

        <a
            href="index.html"
            class="header-button"
        >
            ⌂
        </a>

    </div>

</header>


<main class="admin-page">

    <div class="admin-container">

        <div class="admin-header">

            <h1>
                <span>Admin</span> Paneli
            </h1>

            <p>
                Film bilgilerini ve video URL'sini
                buradan yönetebilirsin.
            </p>

        </div>


        <section class="admin-panel">

            <form id="movieForm">


                <div class="form-grid">


                    <div class="form-group full">

                        <label>
                            Film Adı
                        </label>

                        <input
                            type="text"
                            id="movieName"
                            placeholder="Örn: The Ritual"
                            required
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            Poster URL
                        </label>

                        <input
                            type="url"
                            id="posterUrl"
                            placeholder="https://site.com/poster.jpg"
                            required
                        >

                        <small class="form-help">
                            Doğrudan görsel adresi kullan.
                        </small>

                    </div>


                    <div class="form-group full">

                        <label>
                            Video / İzleme URL
                        </label>

                        <input
                            type="url"
                            id="videoUrl"
                            placeholder="https://site.com/video.mp4"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Yapım Yılı
                        </label>

                        <input
                            type="number"
                            id="movieYear"
                            min="1900"
                            max="2100"
                            placeholder="2025"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Süre (Dakika)
                        </label>

                        <input
                            type="number"
                            id="movieRuntime"
                            min="1"
                            placeholder="106"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Tür
                        </label>

                        <select id="movieGenre">

                            <option>Korku</option>
                            <option>Gerilim</option>
                            <option>Aksiyon</option>
                            <option>Bilim Kurgu</option>
                            <option>Dram</option>
                            <option>Komedi</option>
                            <option>Romantik</option>
                            <option>Macera</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Puan
                        </label>

                        <input
                            type="number"
                            id="movieRating"
                            min="0"
                            max="10"
                            step="0.1"
                            placeholder="8.5"
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            Açıklama
                        </label>

                        <textarea
                            id="movieDescription"
                            placeholder="Film açıklamasını yaz..."
                        ></textarea>

                    </div>


                </div>


                <div id="adminMessage"></div>


                <div class="admin-actions">

                    <button
                        type="button"
                        class="admin-button cancel-button"
                        onclick="location.href='index.html'"
                    >
                        İptal
                    </button>

                    <button
                        type="submit"
                        class="admin-button save-button"
                    >
                        ✓ Filmi Kaydet
                    </button>

                </div>


            </form>

        </section>

    </div>

</main>


<nav class="bottom-navigation">

    <a href="index.html">
        <span>⌂</span>
        <small>Ana Sayfa</small>
    </a>

    <a href="movies.html">
        <span>▣</span>
        <small>Filmler</small>
    </a>

    <a href="packages.html">
        <span>＋</span>
        <small>Premium</small>
    </a>

    <a href="profile.html">
        <span>♙</span>
        <small>Profil</small>
    </a>

</nav>


<script>

/* =========================================
   ADMIN OTURUM KONTROLÜ
========================================= */

const adminSession =
    sessionStorage.getItem(
        "filmkeyfi_admin"
    );

if (adminSession !== "true") {

    window.location.href =
        "login.html";

}


/* =========================================
   FİLM KAYDETME
========================================= */

const movieForm =
    document.getElementById(
        "movieForm"
    );

const message =
    document.getElementById(
        "adminMessage"
    );


movieForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const movie = {

            id: Date.now(),

            title:
                document
                .getElementById("movieName")
                .value
                .trim(),

            poster:
                document
                .getElementById("posterUrl")
                .value
                .trim(),

            video:
                document
                .getElementById("videoUrl")
                .value
                .trim(),

            year:
                document
                .getElementById("movieYear")
                .value,

            runtime:
                document
                .getElementById("movieRuntime")
                .value,

            genre:
                document
                .getElementById("movieGenre")
                .value,

            rating:
                document
                .getElementById("movieRating")
                .value,

            description:
                document
                .getElementById("movieDescription")
                .value
                .trim()

        };


        const movies =
            JSON.parse(
                localStorage.getItem(
                    "filmkeyfi_movies"
                ) || "[]"
            );


        movies.push(movie);


        localStorage.setItem(
            "filmkeyfi_movies",
            JSON.stringify(movies)
        );


        message.className =
            "success";

        message.textContent =
            "✓ Film başarıyla kaydedildi!";


        movieForm.reset();


        /*
           Kısa süre sonra ana sayfaya dön.
        */

        setTimeout(function() {

            window.location.href =
                "index.html";

        }, 800);

    }

);

</script>


</body>
</html>
