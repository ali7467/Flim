<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>Filmler - FilmKeyfi</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* ==============================
           FİLMLER SAYFASI
        ============================== */

        .movies-page {
            min-height: 100vh;

            padding:
                35px 5%
                110px;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255,0,60,.12),
                    transparent 35%
                ),
                #050505;
        }

        .movies-title {
            margin-bottom: 25px;
        }

        .movies-title h1 {
            font-size: 38px;

            margin-bottom: 8px;

            font-weight: 900;
        }

        .movies-title h1 span {
            color: #ff003c;

            text-shadow:
                0 0 10px rgba(255,0,60,.6);
        }

        .movies-title p {
            color: #777;

            font-size: 14px;
        }

        /* ==============================
           ARAMA
        ============================== */

        .search-box {
            display: flex;

            width: 100%;

            max-width: 700px;

            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;

            height: 48px;

            padding: 0 16px;

            background: #101012;

            color: white;

            border: 1px solid
                rgba(255,255,255,.1);

            border-right: none;

            outline: none;

            border-radius:
                8px 0 0 8px;

            font-size: 14px;
        }

        .search-box input:focus {
            border-color: #ff003c;

            box-shadow:
                0 0 15px
                rgba(255,0,60,.15);
        }

        .search-box button {
            width: 55px;

            border: none;

            background: #ff003c;

            color: white;

            border-radius:
                0 8px 8px 0;

            cursor: pointer;

            font-size: 19px;

            box-shadow:
                0 0 15px
                rgba(255,0,60,.25);
        }

        /* ==============================
           TÜRLER
        ============================== */

        .genres {
            display: flex;

            gap: 8px;

            overflow-x: auto;

            padding-bottom: 8px;

            margin-bottom: 30px;
        }

        .genre {
            flex-shrink: 0;

            padding:
                8px 14px;

            border-radius: 20px;

            border: 1px solid
                rgba(255,255,255,.1);

            background: #101012;

            color: #aaa;

            cursor: pointer;

            transition: .25s;

            font-size: 12px;
        }

        .genre:hover,
        .genre.active {
            color: white;

            background: #ff003c;

            border-color: #ff003c;

            box-shadow:
                0 0 15px
                rgba(255,0,60,.4);
        }

        /* ==============================
           FİLM GRID
        ============================== */

        .movies-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(165px, 1fr)
                );

            gap: 18px;
        }

        /* ==============================
           LOADING
        ============================== */

        .loading {
            grid-column: 1 / -1;

            text-align: center;

            padding: 70px 20px;

            color: #777;
        }

        .loading-circle {
            width: 35px;
            height: 35px;

            margin:
                0 auto 15px;

            border-radius: 50%;

            border:
                3px solid #222;

            border-top-color:
                #ff003c;

            animation:
                spin .8s linear infinite;

            box-shadow:
                0 0 15px
                rgba(255,0,60,.3);
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        /* ==============================
           MOBİL
        ============================== */

        @media (max-width: 600px) {

            .movies-page {
                padding:
                    25px 15px
                    100px;
            }

            .movies-title h1 {
                font-size: 30px;
            }

            .movies-grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- ==============================
         HEADER
    ============================== -->

    <header class="header">

        <a
            href="index.html"
            class="logo"
        >
            <span>FILM</span>KEYFİ
        </a>


        <div class="header-actions">

            <a
                href="login.html"
                class="header-button"
            >
                ◯
            </a>

            <button
                class="header-button menu-button"
                id="menuButton"
            >
                ☰
            </button>

        </div>

    </header>


    <!-- ==============================
         MOBİL MENÜ
    ============================== -->

    <div
        class="mobile-menu"
        id="mobileMenu"
    >

        <button
            class="close-menu"
            id="closeMenu"
        >
            ×
        </button>

        <a href="index.html">
            Ana Sayfa
        </a>

        <a href="movies.html">
            Filmler
        </a>

        <a href="packages.html">
            Premium
        </a>

        <a href="login.html">
            Giriş Yap
        </a>

        <a href="register.html">
            Üye Ol
        </a>

    </div>


    <!-- ==============================
         FİLMLER
    ============================== -->

    <main class="movies-page">


        <div class="movies-title">

            <h1>
                <span>Film</span> Arşivi
            </h1>

            <p>
                En popüler filmleri keşfet.
            </p>

        </div>


        <!-- ARAMA -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Film ara..."
                autocomplete="off"
            >

            <button
                id="searchButton"
            >
                🔍
            </button>

        </div>


        <!-- TÜRLER -->

        <div class="genres">

            <button
                class="genre active"
                data-genre="all"
            >
                Tümü
            </button>

            <button
                class="genre"
                data-genre="28"
            >
                Aksiyon
            </button>

            <button
                class="genre"
                data-genre="27"
            >
                Korku
            </button>

            <button
                class="genre"
                data-genre="53"
            >
                Gerilim
            </button>

            <button
                class="genre"
                data-genre="878"
            >
                Bilim Kurgu
            </button>

            <button
                class="genre"
                data-genre="35"
            >
                Komedi
            </button>

            <button
                class="genre"
                data-genre="18"
            >
                Dram
            </button>

            <button
                class="genre"
                data-genre="10749"
            >
                Romantik
            </button>

        </div>


        <!-- FİLMLER -->

        <div
            class="movies-grid"
            id="moviesGrid"
        >

            <div class="loading">

                <div
                    class="loading-circle"
                ></div>

                Filmler yükleniyor...

            </div>

        </div>


    </main>


    <!-- ==============================
         ALT MENÜ
    ============================== -->

    <nav class="bottom-navigation">

        <a href="index.html">

            <span>⌂</span>

            <small>
                Ana Sayfa
            </small>

        </a>


        <a
            href="movies.html"
            class="active"
        >

            <span>▣</span>

            <small>
                Filmler
            </small>

        </a>


        <a href="packages.html">

            <span>＋</span>

            <small>
                Premium
            </small>

        </a>


        <a href="profile.html">

            <span>♙</span>

            <small>
                Profil
            </small>

        </a>

    </nav>


    <script src="js/app.js"></script>
<script>

document.addEventListener("DOMContentLoaded", function () {

    const grid = document.getElementById("moviesGrid");

    if (!grid) return;

    const savedMovies = JSON.parse(
        localStorage.getItem("filmkeyfi_movies") || "[]"
    );

    if (savedMovies.length === 0) {
        return;
    }

    grid.innerHTML = "";

    savedMovies.forEach(function (movie) {

        const card = document.createElement("article");

        card.className = "movie-card";

        card.innerHTML = `
            <div
                class="poster"
                style="
                    background-image:
                    url('${movie.poster}');
                    background-size: cover;
                    background-position: center;
                "
            ></div>

            <div class="movie-card-info">

                <span class="quality">
                    HD
                </span>

                <h3>
                    ${movie.title}
                </h3>

                <p>
                    ${movie.year || "----"}
                    · ${movie.runtime || "--"} dk
                </p>

            </div>
        `;

        card.addEventListener("click", function () {

            localStorage.setItem(
                "filmkeyfi_selected_movie",
                JSON.stringify(movie)
            );

            window.location.href =
                "movie.html";

        });

        grid.appendChild(card);

    });

});

</script>
</body>

</html>
